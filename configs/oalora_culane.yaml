# ============================================================
# OA-LoRA Configuration - CULane
# ============================================================

model:
  base_model: "stabilityai/stable-diffusion-xl-base-1.0"
  vae_model: "madebyollin/sdxl-vae-fp16-fix"

dataset:
  name: "CULane"
  root_dir: ""
  selected_images_dir: ""
  num_images: 2000

training:
  resolution: 1024
  batch_size: 1
  learning_rate: 6.0e-5
  mixed_precision: "fp16"
  optimizer: "Adam"
  seed: 469

lora:
  rank: 32
  alpha: 32

prior_preservation:
  enabled: true
  prior_loss_weight: 1.0
  num_class_images: 100

sampling:
  num_inference_steps: 50
  scheduler: "DDIM"

data_scheduling:
  method: "ASDS"
  synthetic_to_real_ratio: "1:3"

output:
  output_dir: ""
  save_model: true
